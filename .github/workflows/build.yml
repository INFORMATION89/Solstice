name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test_key_available: ${{ steps.test_key_check.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: No old Material Icons
        run: "! grep -rn 'androidx.compose.material.icons' --include=*.kt --include=*.kts --include=*.toml ."

      - name: Fetch comparison base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          test -n "$BASE_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: No hardcoded UI literals
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 .github/scripts/check_no_hardcoding.py --self-test
          python3 .github/scripts/check_no_hardcoding.py "$BASE_SHA"

      - name: Check whether the test signing key is available
        id: test_key_check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TEST_KEYSTORE: ${{ secrets.SOLSTICE_TEST_KEYSTORE_BASE64 }}
          TEST_PASSWORD: ${{ secrets.SOLSTICE_TEST_KEY_PASSWORD }}
        run: |
          if [ -n "$TEST_KEYSTORE" ] && [ -n "$TEST_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure test signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.test_key_check.outputs.available == 'true'
        env:
          TEST_KEYSTORE: ${{ secrets.SOLSTICE_TEST_KEYSTORE_BASE64 }}
          TEST_PASSWORD: ${{ secrets.SOLSTICE_TEST_KEY_PASSWORD }}
        run: |
          umask 077
          mkdir -p ~/.android
          echo "$TEST_KEYSTORE" | base64 -d > ~/.android/solstice-test.keystore
          printf '%s' "$TEST_PASSWORD" > ~/.android/solstice-test.password

      # One Gradle invocation shares configuration/task-graph work across formatting,
      # tests, and app variants. PRs never receive signing secrets; only main may assemble Profile.
      - name: Verify and build
        env:
          BUILD_PROFILE: ${{ steps.test_key_check.outputs.available == 'true' }}
        run: |
          tasks=(spotlessCheck :motion:motion:testDebugUnitTest :weather-unit:testDebugUnitTest :maps-utils:testDebugUnitTest :app:testBasicDebugUnitTest assembleBasicDebug)
          if [ "$BUILD_PROFILE" = "true" ]; then
            tasks+=(assembleBasicProfile)
          fi
          ./gradlew "${tasks[@]}"

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solstice-basic-debug
          path: app/build/outputs/apk/basic/debug/*.apk

      - name: Upload profile APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.test_key_check.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solstice-testing-profile
          path: app/build/outputs/apk/basic/profile/*arm64-v8a*.apk
          if-no-files-found: error

  publish-testing:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.test_key_available == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download profile APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: solstice-testing-profile

      - name: Publish the testing pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          mv ./*.apk "solstice-testing-$short.apk"
          gh release delete testing --yes --cleanup-tag || true
          gh release create testing "solstice-testing-$short.apk" \
            --prerelease \
            --title "Solstice testing ($short)" \
            --notes "Latest test build of main, commit $short. Installs as Solstice (profile) next to other builds, with the Motion Lab launcher icon."
