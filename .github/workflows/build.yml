name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test_key_available: ${{ steps.test_key_check.outputs.available }}
    env:
      TEST_KEYSTORE: ${{ secrets.SOLSTICE_TEST_KEYSTORE_BASE64 }}
      TEST_PASSWORD: ${{ secrets.SOLSTICE_TEST_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Lint (spotless)
        run: ./gradlew spotlessCheck

      - name: No old Material Icons
        run: "! grep -rn 'androidx.compose.material.icons' --include=*.kt --include=*.kts --include=*.toml ."

      - name: Unit tests (Motion)
        run: ./gradlew :motion:motion:testDebugUnitTest

      - name: Assemble basic debug
        run: ./gradlew assembleBasicDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: solstice-basic-debug
          path: app/build/outputs/apk/basic/debug/*.apk

      - name: Check whether the test signing key is available
        id: test_key_check
        run: |
          if [ -n "$TEST_KEYSTORE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure test signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.test_key_check.outputs.available == 'true'
        run: |
          mkdir -p ~/.android
          echo "$TEST_KEYSTORE" | base64 -d > ~/.android/solstice-test.keystore
          printf '%s' "$TEST_PASSWORD" > ~/.android/solstice-test.password

      - name: Assemble basic profile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.test_key_check.outputs.available == 'true'
        run: ./gradlew assembleBasicProfile

      - name: Upload profile APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.test_key_check.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: solstice-testing-profile
          path: app/build/outputs/apk/basic/profile/*arm64-v8a*.apk
          if-no-files-found: error

  publish-testing:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.test_key_available == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download profile APK
        uses: actions/download-artifact@v4
        with:
          name: solstice-testing-profile

      - name: Publish the testing pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          mv ./*.apk "solstice-testing-$short.apk"
          gh release delete testing --yes --cleanup-tag || true
          gh release create testing "solstice-testing-$short.apk" \
            --prerelease \
            --title "Solstice testing ($short)" \
            --notes "Latest test build of main, commit $short. Installs as Solstice (profile) next to other builds, with the Motion Lab launcher icon."
